id: 8c5c766a-ce9b-4112-b6ed-1b8fe33733b7
name: 'SecurityBridge: A critical event occured'
description: |
  'This rule alerts if there is any critical event occured in the SAP system'
severity: Medium
queryFrequency: 5m
queryPeriod: 5m
triggerOperator: gt
triggerThreshold: 0
status: Available
tactics:
  - InitialAccess
relevantTechniques:
  - T1189
query: |
  SecurityBridge_CL
  | extend sev = todouble(severity)
  | where sev between (9.0 .. 10.0)
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: User
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Terminal
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IP
  - entityType: Mailbox
    fieldMappings:
      - identifier: MailboxPrimaryAddress
        columnName: UPN
version: 1.0.5
kind: Scheduled
